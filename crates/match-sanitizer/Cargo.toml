[package]
name = "match-sanitizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.29", default-features = false }
