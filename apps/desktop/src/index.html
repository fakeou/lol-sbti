<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOL-SBTI 分析客户端</title><link rel="stylesheet" href="styles.css"></head><body><main id="app"><h1>LOL-SBTI</h1><section><p>● LCU <strong id="lcu-status">检测中…</strong></p><p>当前用户：<span id="current-user">—</span></p></section><section id="preview" hidden><h2>数据预览</h2><p>实际可读取 <strong id="match-count">0</strong> 场（范围 5–100 场）</p><p>时间：<span id="match-time">—</span></p><p>模式：<span id="match-modes">—</span></p><p id="skipped-summary" hidden>已跳过 <strong id="skipped-count">0</strong> 场：<span id="skip-reasons">—</span></p></section><section class="privacy"><p><b>将上传：</b>时间（分钟精度）、模式、英雄、位置、胜负、KDA、经济、伤害、视野和装备。</p><p><b>不上传：</b>LCU Token、账号 ID、PUUID、Summoner ID、对局 ID、玩家名及原始响应。</p><p><b>保留期：</b>输入完成后删除（失败最多 1 小时）；报告 24 小时；临时链接 30 分钟。</p><p><b>模型披露：</b>脱敏指标将交由服务端配置的结构化 AI 模型处理；仅用于娱乐性数据归纳，不代表心理诊断或官方评级。</p><label><input id="confirm" type="checkbox"> 我已查看并主动确认以上上传字段、排除字段、保留期和模型披露</label></section><button id="upload-btn" disabled>上传并生成 LBTI 报告</button><section id="progress" hidden><h2>分析进度</h2><p id="progress-text"></p><button id="retry-btn" hidden>重试</button><button id="open-btn" hidden>在系统浏览器中查看</button><button id="revoke-btn" hidden>立即撤销链接</button><button id="delete-btn">取消并删除</button></section><p id="message" role="status"></p></main><script src="app.js"></script></body></html>
