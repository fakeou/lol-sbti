[package]
name = "lol-sbti"
version = "0.1.0"
description = "只读采集 LCU 对局并上传生成临时分析报告"
edition = "2021"
rust-version = "1.78"

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
tauri = { version = "2.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lcu-client = { path = "../../../crates/lcu-client" }
match-sanitizer = { path = "../../../crates/match-sanitizer" }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
opener = "0.7"
parking_lot = "0.12"
secrecy = "0.10"

[dev-dependencies]
tempfile = "3"
