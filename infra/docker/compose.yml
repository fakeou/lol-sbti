services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lol_sbti
      POSTGRES_USER: lol_sbti
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lol_sbti"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ../migrations:/docker-entrypoint-initdb.d:ro
